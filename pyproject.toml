[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova"
version = "0.1.0"
description = "NOVA: real-time EEG neurofeedback with hardware support via BrainFlow and LSL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
brainflow = ["brainflow>=5.10"]
lsl = ["pylsl>=1.16"]
audio = ["sounddevice>=0.4"]
visual = ["pygame>=2.5"]
all = ["brainflow>=5.10", "pylsl>=1.16", "sounddevice>=0.4", "pygame>=2.5"]
dev = ["pytest>=7"]

[project.scripts]
nova = "nova.cli:main"

[tool.setuptools]
packages = ["nova"]

[tool.setuptools.package-data]
nova = ["dashboard/*.html", "dashboard/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
