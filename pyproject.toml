[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro"
version = "0.1.0"
description = "Real-time EEG neurofeedback trainer with hardware support via BrainFlow and LSL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
brainflow = ["brainflow>=5.10"]
lsl = ["pylsl>=1.16"]
audio = ["sounddevice>=0.4"]
visual = ["pygame>=2.5"]
all = ["brainflow>=5.10", "pylsl>=1.16", "sounddevice>=0.4", "pygame>=2.5"]
dev = ["pytest>=7"]

[project.scripts]
neuro = "neuro.cli:main"

[tool.setuptools]
packages = ["neuro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
